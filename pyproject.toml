[tool.pytest.ini_options]
testpaths = ["tests"]
# The `pytest` script does not put the repo root on sys.path. CI runs that
# script, so the local package has to be added explicitly.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["groupbot", "tests", "bot.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["groupbot"]
